ACT.rebuild = body => {
  const base = store.get('baseline', '');
  body.appendChild(el('<p>Here is the prompt you wrote at 09:20. Rebuild it using everything from today, then note the three biggest changes and the truth each one applies.</p>'));
  const s = store.get('rebuild', {});
  const g = el(`<div class="grid2"><div class="spec bad"><span class="lab">Your 09:20 prompt</span><pre>${base ? esc(base) : 'No baseline saved in this browser. Write one in M0 → Try it.'}</pre></div>
    <div class="field"><label for="rbN">Your rebuilt prompt</label><textarea id="rbN" rows="8" style="font-family:var(--f-mono);font-size:14px" placeholder="Role… Audience… Goal… Background… Constraints… Output format…">${esc(s.n || '')}</textarea></div></div>`);
  body.appendChild(g);
  const w = el(`<div class="field"><label for="rbW">Three biggest changes, and the truth each applies</label><textarea id="rbW" rows="4" placeholder="1. Added Meera’s name and two memories (Truth 3: input quality)…">${esc(s.w || '')}</textarea></div>`);
  body.appendChild(w);
  const out = el('<div class="grid3"></div>'); body.appendChild(out);
  const wc = t => t.trim() ? t.trim().split(/\s+/).length : 0;
  const upd = () => { const n = $('#rbN', g).value; store.set('rebuild', {n, w: $('#rbW', w).value}); out.innerHTML = `<div class="stat"><span class="v">${wc(base)}</span><span class="l">words at 09:20</span></div><div class="stat"><span class="v">${wc(n)}</span><span class="l">words now</span></div><div class="stat"><span class="v">${['role','audience','goal','background','constraint','format','step','under','words'].filter(k => n.toLowerCase().includes(k)).length}</span><span class="l">structure signals found</span></div>`; };
  $('#rbN', g).addEventListener('input', upd); $('#rbW', w).addEventListener('input', upd); upd();
};

/* ---------- final exam ---------- */
function pageExam(v){
  const page = el(`<div class="page"><header class="mhead"><span class="eyebrow">Assessment</span><h1>Final assessment</h1>
    <p class="lede col">20 multiple-choice questions drawn from a bank of ${Object.values(FINAL_BANK).reduce((s, a) => s + a.length, 0)}, weighted by module. 20 minutes. Pass mark 70% (14 of 20). Closed book, individual.</p></header><div id="exBody" class="stack" style="gap:18px"></div></div>`);
  v.appendChild(page);
  const b = $('#exBody', page);
  const intro = () => {
    b.innerHTML = '';
    const bp = BLUEPRINT.map(x => `<tr><td>${modById(x[0]).code} ${esc(modById(x[0]).title)}</td><td class="num">${x[1]}</td></tr>`).join('');
    b.appendChild(el(`<div class="grid2">
      <div class="panel stack"><h3>Before you start</h3><ul class="inst-list"><li>Each attempt draws a fresh set of questions and shuffles the answers.</li><li>The timer counts down from 20:00 and submits automatically at zero.</li><li>Your answers are saved as you go. If you leave this page or refresh, you can carry on, but the timer keeps running.</li><li>You get your score, a module breakdown and explanations at the end.</li><li>Trainees with an approved accommodation get 25% extra time: tick the box below.</li></ul>
      ${S.exam ? `<p><span class="pill ${S.exam.best >= 70 ? 'ok' : 'no'}">Best so far: ${S.exam.best}%</span> <span class="muted">${S.exam.attempts} attempt${S.exam.attempts === 1 ? '' : 's'}</span></p>` : ''}
      <label class="row" style="gap:8px"><input type="checkbox" id="exExtra"> Extra time (25 minutes)</label>
      <div><button class="btn acc" id="exStart">Start the assessment</button></div></div>
      <div class="panel stack"><h3>What is covered</h3><div class="tbl-wrap"><table class="mini"><thead><tr><th>Module</th><th>Questions</th></tr></thead><tbody>${bp}</tbody></table></div></div></div>`));
    $('#exStart', b).addEventListener('click', () => start($('#exExtra', b).checked ? 25 : 20));
  };
  function start(mins){
    const qs = [];
    BLUEPRINT.forEach(([mid, n]) => shuffle(FINAL_BANK[mid]).slice(0, n).forEach(q => {
      const opts = shuffle(q.o.map((t, i) => ({t, c: i === q.a})));
      qs.push({mid, q:q.q, why:q.why, opts:opts.map(o => o.t), a: opts.findIndex(o => o.c)});
    }));
    const run = {qs, ans: qs.map(() => -1), deadline: Date.now() + mins * 60000};
    store.set('examRun', run);
    renderRun(run, false);
  }
  function renderRun(run, resumed){
    const qs = run.qs;
    b.innerHTML = '';
    if (resumed) b.appendChild(el('<p class="resume-note"><b>Assessment resumed.</b> Your saved answers are back. The timer kept running while you were away.</p>'));
    const timer = el('<div class="timer"><span>Answered <b id="exAns">0</b> of ${qs.length}</span><span class="num" id="exClock" aria-live="off"></span></div>');
    b.appendChild(timer);
    const form = el(`<div class="quiz">${qs.map((q, i) => `<div class="qcard" id="exq${i}"><span class="qn">Question ${i + 1} of ${qs.length} · ${modById(q.mid).code}</span><div class="qq">${esc(q.q)}</div><div class="opts exam-opts">${q.opts.map((o, j) => `<label><input type="radio" name="exq${i}" value="${j}"${run.ans[i] === j ? ' checked' : ''}><span>${esc(o)}</span></label>`).join('')}</div></div>`).join('')}</div>`);
    b.appendChild(form);
    const foot = el('<div class="stack"><div><button class="btn acc" id="exSubmit">Submit assessment</button></div><div id="exConfirm"></div></div>'); b.appendChild(foot);
    const answers = () => qs.map((_, i) => { const r = $(`input[name="exq${i}"]:checked`, form); return r ? +r.value : -1; });
    const count = () => { $('#exAns', timer).textContent = answers().filter(x => x >= 0).length; };
    form.addEventListener('change', () => { run.ans = answers(); store.set('examRun', run); count(); });
    count();
    const clock = () => { const left = Math.max(0, Math.ceil((run.deadline - Date.now()) / 1000)); const mm = Math.floor(left / 60), ss = left % 60; $('#exClock', timer).textContent = mm + ':' + String(ss).padStart(2, '0'); return left; };
    clock();
    window.__examTimer = setInterval(() => { if (clock() <= 0){ clearInterval(window.__examTimer); window.__examTimer = null; finish(run, answers(), true); } }, 1000);
    $('#exSubmit', foot).addEventListener('click', () => {
      const un = answers().filter(x => x < 0).length, cf = $('#exConfirm', foot);
      if (!un) return finish(run, answers(), false);
      cf.innerHTML = ''; const box = el(`<div class="inline-confirm"><b>You have ${un} unanswered question${un === 1 ? '' : 's'}.</b><span>Unanswered questions score zero. Submit anyway?</span><div class="row"><button class="btn acc">Submit now</button><button class="btn ghost">Keep working</button></div></div>`);
      const [yes, no] = $$('button', box); yes.addEventListener('click', () => finish(run, answers(), false)); no.addEventListener('click', () => cf.innerHTML = ''); cf.appendChild(box);
    });
  }
  function finish(run, ans, timeout){
    if (window.__examTimer){ clearInterval(window.__examTimer); window.__examTimer = null; }
    store.set('examRun', null);
    const qs = run.qs; let score = 0; const per = {};
    qs.forEach((q, i) => { per[q.mid] = per[q.mid] || [0, 0]; per[q.mid][1]++; if (ans[i] === q.a){ score++; per[q.mid][0]++; } });
    const pct = Math.round(100 * score / qs.length), pass = pct >= 70;
    const prev = S.exam || {best:0, attempts:0};
    const today = new Date().toISOString().slice(0, 10);
    S.exam = {best: Math.max(prev.best, pct), last: pct, attempts: prev.attempts + 1, date: today, bestDate: pct >= prev.best ? today : prev.bestDate};
    store.set('exam', S.exam); renderNav(current);
    b.innerHTML = '';
    const res = el(`<div class="stack" style="gap:18px">
      <div class="scorebox"><span class="big">${pct}%</span><div class="stack" style="gap:4px"><b>${pass ? (pct >= 90 ? 'Passed at distinction level.' : 'Passed.') : 'Not yet passed.'}</b><span class="muted">${score} of ${qs.length} correct${timeout ? ' · submitted automatically when time ran out' : ''}. Pass mark 70%.</span></div>
      <div class="row" style="margin-left:auto">${pass ? '<a class="btn acc" href="#cert" style="text-decoration:none">Get your certificate</a>' : ''}<button class="btn ghost" id="exAgain">${pass ? 'Take it again' : 'Retake'}</button></div></div>
      <div class="panel stack"><h3>By module</h3><div class="bars">${BLUEPRINT.map(([mid]) => { const p = per[mid]; return `<div class="bar"><span>${modById(mid).code} ${esc(modById(mid).title.split(':')[0])}</span><span class="tr"><i style="width:${100 * p[0] / p[1]}%"></i></span><span class="pct">${p[0]}/${p[1]}</span></div>`; }).join('')}</div>${!pass ? '<p class="muted">Revisit the notes for your lowest modules before retaking. Your certification rules allow one retake within 14 days.</p>' : ''}</div>
      <h3>Review</h3>
      <div class="quiz">${qs.map((q, i) => { const ok = ans[i] === q.a; return `<div class="qcard"><span class="qn">Question ${i + 1} · ${modById(q.mid).code}</span><div class="qq">${esc(q.q)}</div><div class="opts">${q.opts.map((o, j) => `<div class="opt ${j === q.a ? 'right' : (j === ans[i] ? 'wrong' : '')}"><span class="k">${j === q.a ? '✓' : (j === ans[i] ? '✗' : '')}</span><span>${esc(o)}</span></div>`).join('')}</div><div class="fb ${ok ? 'ok' : 'no'}"><b>${ok ? 'Correct.' : ans[i] < 0 ? 'Not answered.' : 'Incorrect.'}</b> ${esc(q.why)}</div></div>`; }).join('')}</div></div>`);
    b.appendChild(res);
    $('#exAgain', res).addEventListener('click', intro);
    window.scrollTo(0, 0);
  }
  const run = store.get('examRun', null);
  if (run && run.qs && run.deadline){
    if (Date.now() >= run.deadline) finish(run, run.ans, true);
    else renderRun(run, true);
  } else intro();
}

/* ---------- certification ---------- */
function pageCert(v){
  const done = CHECK_MODS.filter(m => S.scores[m.id]).length, ex = S.exam;
  const cs = store.get('capstoneScore', ''), nm = store.get('certName', '');
  const page = el(`<div class="page">
  <header class="mhead"><span class="eyebrow">Certification framework</span><h1>First-Principles Prompting Certificate</h1>
  <p class="lede col">Certification confirms that a student can explain how language models process words, build structured prompts from first principles, and debug them systematically, while using AI within their college’s academic-integrity policy. It is earned through attendance, knowledge checks, an individual final assessment and an individual capstone.</p></header>

  <section class="stack"><h2>Three levels</h2><div class="grid3">
    <div class="panel stack"><span class="label">Level 1</span><h3>Certificate of Attendance</h3><ul class="inst-list"><li>Attend at least 90% of the session (7 h 12 min)</li></ul></div>
    <div class="panel stack"><span class="label acc">Level 2</span><h3>First-Principles Prompting Certified</h3><ul class="inst-list"><li>Attendance requirement met</li><li>All six module checks (M1–M6) attempted</li><li>Final assessment 70% or higher</li><li>Capstone prompt 12/20 or higher</li></ul></div>
    <div class="panel stack"><span class="label warm">Level 3</span><h3>Certified with Distinction</h3><ul class="inst-list"><li>All Level 2 requirements</li><li>Final assessment 90% or higher</li><li>Capstone prompt 17/20 or higher</li></ul></div>
  </div></section>

  <section class="stack"><h2>Assessment components</h2><div class="tbl-wrap panel" style="padding:0"><table class="mini"><thead><tr><th>Component</th><th>What</th><th>When</th><th>Scored by</th><th>Requirement</th></tr></thead><tbody>
    <tr><td><b>Pre-test</b></td><td>8 questions, baseline</td><td>M0</td><td>Self, instant</td><td>Not graded</td></tr>
    <tr><td><b>Module checks</b></td><td>${MODULES.filter(m => m.quiz && m.id !== 'm0').reduce((s, m) => s + m.quiz.length, 0)} questions across M1–M6, instant feedback</td><td>End of each module</td><td>Self, instant</td><td>Attempt all six</td></tr>
    <tr><td><b>Final assessment</b></td><td>20 questions, weighted by module, 20 minutes, closed book</td><td>M7</td><td>Automatic</td><td>70% (14/20)</td></tr>
    <tr><td><b>Capstone prompt</b></td><td>Individual prompt and test log for one of four briefs, 5 criteria × 4 levels</td><td>M7</td><td>Instructor, within 5 working days</td><td>12/20</td></tr>
  </tbody></table></div></section>

  <section class="stack"><h2>Capstone rubric</h2><div class="tbl-wrap panel" style="padding:0"><table class="mini"><thead><tr><th>Criterion</th><th>1 · Beginning</th><th>2 · Developing</th><th>3 · Proficient</th><th>4 · Exemplary</th></tr></thead><tbody>${RUBRIC.map(r => `<tr><td><b>${esc(r.c)}</b></td>${r.d.map(d => `<td>${esc(d)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <p class="muted col">The capstone is scored on the prompt as written and its test log, not on the AI’s output, which varies by tool and day. A second instructor blind-scores a 20% sample; differences of more than 2 points are agreed together.</p></section>

  <section class="grid2">
    <div class="panel stack"><h3>Policies</h3><ul class="inst-list">
      <li><strong>Retakes:</strong> one retake of the final assessment within 14 days, with a fresh draw of questions. Further attempts need the programme owner’s approval.</li>
      <li><strong>Accommodations:</strong> 25% extra time on the final assessment on request; screen-reader friendly format; verbal administration by arrangement.</li>
      <li><strong>Integrity:</strong> the final assessment is individual and closed book. The capstone is individual and open notes; AI tools may be used to test the prompt, not to write it. All AI use outside the course follows the college’s academic-integrity policy.</li>
      <li><strong>Validity:</strong> 12 months. Renew with a 60-minute refresher and a 10-question update check (80% or higher).</li>
      <li><strong>Appeals:</strong> raise within 10 working days to the programme owner; a second instructor re-scores the capstone.</li></ul></div>
    <div class="panel stack"><h3>Records and evidence</h3><ul class="inst-list">
      <li>Instructor records attendance, final score and capstone score in the course record.</li>
      <li>Progress in this module is saved in the student’s browser only. It is a convenience, not the official record.</li>
      <li>The certificate carries a unique ID. Instructors log the ID against the student’s record so it can be verified.</li>
      <li>Instructors review item statistics after each cohort and retire questions that more than 90% or fewer than 30% answer correctly.</li></ul></div>
  </section>

  <section class="stack"><h2>Your progress</h2><div class="grid3">
    <div class="stat"><span class="v">${done}/${CHECK_MODS.length}</span><span class="l">module checks attempted</span></div>
    <div class="stat"><span class="v">${ex ? ex.best + '%' : '—'}</span><span class="l">best final assessment score</span></div>
    <div class="stat"><span class="v">${S.scores.m0 ? S.scores.m0.score + '/8' : '—'}</span><span class="l">pre-test (baseline)</span></div>
  </div></section>

  <section class="panel stack" id="gen"><h2>Generate your certificate</h2>
    <p class="muted">Available once you have passed the final assessment and attempted all module checks. Enter the capstone score your instructor gave you.</p>
    <div class="grid2"><div class="field"><label for="ctName">Full name as it should appear</label><input id="ctName" value="${esc(nm)}" maxlength="100" autocomplete="name"></div>
    <div class="field"><label for="ctCap">Capstone score from your instructor (out of 20)</label><input id="ctCap" type="number" min="0" max="20" step="1" inputmode="numeric" value="${esc(cs)}"></div></div>
    <div class="row"><button class="btn acc" id="ctGo">Create certificate</button><button class="btn ghost inst-only" id="ctPrev">Instructor preview</button><span id="ctMsg" class="muted" aria-live="polite"></span></div>
    <div id="ctOut" class="stack"></div>
  </section></div>`);
  v.appendChild(page);
  const msg = $('#ctMsg', page);
  $('#ctGo', page).addEventListener('click', () => {
    const name = $('#ctName', page).value.trim(), cap = $('#ctCap', page).value === '' ? NaN : +$('#ctCap', page).value;
    store.set('certName', name); store.set('capstoneScore', $('#ctCap', page).value);
    if (!name) return msg.textContent = 'Enter your name.';
    if (!ex || ex.best < 70) return msg.textContent = 'Pass the final assessment first (70% or higher).';
    if (done < CHECK_MODS.length) return msg.textContent = `Attempt all module checks first. ${CHECK_MODS.length - done} still to do.`;
    if (isNaN(cap) || !Number.isInteger(cap) || cap < 0 || cap > 20) return msg.textContent = 'Enter the capstone score your instructor gave you as a whole number from 0 to 20.';
    if (cap < 12) return msg.textContent = 'The capstone needs 12/20 or more for certification. Talk to your instructor about resubmitting.';
    msg.textContent = '';
    drawCert($('#ctOut', page), name, ex.best, cap, ex.bestDate || ex.date, false);
  });
  $('#ctPrev', page).addEventListener('click', () => drawCert($('#ctOut', page), $('#ctName', page).value.trim() || 'Trainee Name', 92, 18, new Date().toISOString().slice(0, 10), true));
}
function drawCert(out, name, pct, cap, date, preview){
  const dist = pct >= 90 && cap >= 17;
  const id = 'FPP-' + date.replace(/-/g, '').slice(2) + '-' + Math.abs([...name + pct + cap].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7)).toString(36).toUpperCase().slice(0, 6);
  const go = () => {
    const W = 1600, H = 1130, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const c = cv.getContext('2d');
    const ink = '#15262B', acc = '#0C6573', warm = '#B8741A', paper = '#FBFCFA', mute = '#56696D';
    c.fillStyle = paper; c.fillRect(0, 0, W, H);
    c.strokeStyle = acc; c.lineWidth = 6; c.strokeRect(40, 40, W - 80, H - 80); c.lineWidth = 1.5; c.strokeRect(60, 60, W - 120, H - 120);
    for (let i = 0; i < 6; i++){ const h = 18 + i * 12; c.fillStyle = i === 5 ? acc : '#D3E9EA'; c.fillRect(W / 2 - 3 * 26 + i * 26, 190 - h, 18, h); }
    c.textAlign = 'center'; c.fillStyle = mute; c.font = '600 22px "JetBrains Mono", monospace'; c.fillText('PROMPT ENGINEERING · FROM FIRST PRINCIPLES', W / 2, 250);
    c.fillStyle = ink; c.font = '800 76px "Bricolage Grotesque", sans-serif'; c.fillText(preview ? 'Certificate (preview)' : 'Certificate of Achievement', W / 2, 350);
    c.fillStyle = mute; c.font = '28px "Atkinson Hyperlegible", sans-serif'; c.fillText('This certifies that', W / 2, 440);
    c.fillStyle = ink; let ulY = 580; const maxW = W - 300, setF = f => c.font = `700 ${f}px "Bricolage Grotesque", sans-serif`;
    let fs = 84; setF(fs); while (c.measureText(name).width > maxW && fs > 52){ fs -= 4; setF(fs); }
    if (c.measureText(name).width <= maxW) c.fillText(name, W / 2, 545);
    else {
      const words = name.split(/\s+/); let best = [name, ''], bd = Infinity;
      for (let i = 1; i < words.length; i++){ const l1 = words.slice(0, i).join(' '), l2 = words.slice(i).join(' '); const d = Math.abs(c.measureText(l1).width - c.measureText(l2).width); if (d < bd){ bd = d; best = [l1, l2]; } }
      fs = 56; setF(fs); while (Math.max(c.measureText(best[0]).width, c.measureText(best[1]).width) > maxW && fs > 24){ fs -= 2; setF(fs); }
      c.fillText(best[0], W / 2, 505); c.fillText(best[1], W / 2, 505 + Math.round(fs * 1.05)); ulY = 505 + Math.round(fs * 1.05) + 26;
    }
    c.strokeStyle = warm; c.lineWidth = 3; c.beginPath(); c.moveTo(W / 2 - 360, ulY); c.lineTo(W / 2 + 360, ulY); c.stroke();
    c.fillStyle = ink; c.font = '30px "Atkinson Hyperlegible", sans-serif';
    c.fillText('has completed the 8-hour course on prompt engineering from first principles,', W / 2, 650);
    c.fillText('from how language models work to systematic debugging, and met the requirements for', W / 2, 695);
    c.fillStyle = dist ? warm : acc; c.font = '800 46px "Bricolage Grotesque", sans-serif'; c.fillText(dist ? 'First-Principles Prompting, with Distinction' : 'First-Principles Prompting Certified', W / 2, 775);
    c.fillStyle = mute; c.font = '24px "JetBrains Mono", monospace'; c.fillText(`Final assessment ${pct}%  ·  Capstone ${cap}/20  ·  ${date}`, W / 2, 835);
    c.strokeStyle = ink; c.lineWidth = 1.5; [[360, 'Lead instructor'], [W - 360, 'Programme owner']].forEach(([x, l]) => { c.beginPath(); c.moveTo(x - 190, 960); c.lineTo(x + 190, 960); c.stroke(); c.fillStyle = mute; c.font = '22px "Atkinson Hyperlegible", sans-serif'; c.fillText(l, x, 995); });
    c.fillStyle = mute; c.font = '20px "JetBrains Mono", monospace'; c.fillText('ID ' + id + ' · valid 12 months', W / 2, 995);
    if (preview){ c.save(); c.translate(W / 2, H / 2); c.rotate(-.35); c.fillStyle = 'rgba(176,56,56,.14)'; c.font = '800 220px "Bricolage Grotesque", sans-serif'; c.fillText('SAMPLE', 0, 60); c.restore(); }
    out.innerHTML = '';
    const img = new Image(); img.className = 'cert-img'; img.alt = 'Certificate for ' + name; img.src = cv.toDataURL('image/png');
    out.appendChild(img);
    out.appendChild(el(`<p class="muted">To save it, right-click the certificate and choose “Save image as”, or long-press it on a phone. Give the ID <span class="mono">${esc(id)}</span> to your instructor so it can be logged.</p>`));
  };
  try { document.fonts.ready.then(go, go); } catch(e){ go(); }
}

/* ---------- boot ---------- */
applyMode();
route();
})();
